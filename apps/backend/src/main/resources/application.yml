spring:
  application:
    name: oneqa-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/oneqa}
    username: ${DB_USERNAME:oneqa}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
