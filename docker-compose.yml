version: "3.9"

name: oneqa

services:
  postgres:
    image: postgres:17
    container_name: oneqa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: oneqa
      POSTGRES_USER: oneqa
      POSTGRES_PASSWORD: oneqa
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oneqa -d oneqa"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: oneqa-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  minio:
    image: minio/minio:latest
    container_name: oneqa-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: oneqa
      MINIO_ROOT_PASSWORD: oneqa123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  rabbitmq:
    image: rabbitmq:4-management
    container_name: oneqa-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: oneqa
      RABBITMQ_DEFAULT_PASS: oneqa

volumes:
  postgres-data:
  redis-data:
  minio-data:
