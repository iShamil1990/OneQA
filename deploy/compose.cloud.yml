name: oneqa-cloud
services:
  backend:
    build:
      context: ../apps/backend
    restart: unless-stopped
    environment:
      ONEQA_DEPLOYMENT_MODE: cloud
      DB_URL: ${DB_URL:?Set managed PostgreSQL JDBC URL}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      ONEQA_SECURITY_JWK_SET_URI: ${ONEQA_SECURITY_JWK_SET_URI:?Set JWK URI}
      ONEQA_SECURITY_ISSUER: ${ONEQA_SECURITY_ISSUER:?Set issuer}
      ONEQA_SECURITY_AUDIENCE: ${ONEQA_SECURITY_AUDIENCE:?Set audience}
    ports:
      - "127.0.0.1:${ONEQA_HTTP_PORT:-8080}:8080"
